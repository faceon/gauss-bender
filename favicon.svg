<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Dark Chalkboard Slate Background -->
    <radialGradient id="chalkboardBg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1e2e25"/>
      <stop offset="60%" stop-color="#0e1713"/>
      <stop offset="100%" stop-color="#060a08"/>
    </radialGradient>

    <!-- Polished Brass Frame Bezel -->
    <linearGradient id="brassBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="30%" stop-color="#d97706"/>
      <stop offset="70%" stop-color="#92400e"/>
      <stop offset="90%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Glowing Bell Curve Gradient -->
    <linearGradient id="curveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Gaussian Area Fill Gradient -->
    <linearGradient id="bellArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Strong Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Bezel Drop Shadow -->
    <filter id="frameShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Outer Squircle Cabinet Frame -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="16" fill="url(#chalkboardBg)" stroke="url(#brassBezel)" stroke-width="3" filter="url(#frameShadow)"/>
  
  <!-- Inner Edge Inset -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="14" fill="none" stroke="#000000" stroke-opacity="0.5" stroke-width="1.2"/>

  <!-- Baseline / Floor Line -->
  <line x1="8" y1="51" x2="56" y2="51" stroke="#94a3b8" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Center Mean Axis (Dashed Chalk Line) -->
  <line x1="32" y1="13" x2="32" y2="50" stroke="#fef08a" stroke-opacity="0.35" stroke-width="1.8" stroke-dasharray="2.5 2.5"/>

  <!-- Gaussian Bell Curve Area Fill Underneath -->
  <path d="M 7 51 C 18 51, 23 13, 32 13 C 41 13, 46 51, 57 51 Z" fill="url(#bellArea)"/>

  <!-- Iconic Gaussian Bell Curve Line (Bold & Luminous) -->
  <path d="M 7 51 C 18 51, 23 13, 32 13 C 41 13, 46 51, 57 51" fill="none" stroke="url(#curveGradient)" stroke-width="4.5" stroke-linecap="round" filter="url(#neonGlow)"/>
</svg>
